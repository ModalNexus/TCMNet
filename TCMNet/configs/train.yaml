# Jointly train TCM-Coarse and the shared TCMFine pair matcher.
PAIR_MATCHER:
  MATCH_COARSE:
    TCM_COARSE_ENABLE: true
    TRAIN_COARSE_PERCENT: 0.3
TRAINER:
  TRAIN_SCOPE: full
  CANONICAL_LR: 0.008
  WARMUP_STEP: 0
  OPTIMIZER: adamw
  ADAMW_DECAY: 0.1
  MSLR_MILESTONES: [10, 15, 20, 25]
